<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Residencial El Dorado</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1226;
  --panel:#0e1730;
  --panel-hover:#18244d;
  --ink:#f4f1e8;
  --ink-soft:rgba(244,241,232,.72);
  --line:rgba(244,241,232,.38);
  --fiber:#e5383b;
  --accent:#ffc247;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b1226;--panel:#0e1730;--ink:#f4f1e8;}
}
:root[data-theme="dark"]{--bg:#0b1226;--panel:#0e1730;--ink:#f4f1e8;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  height:100%;margin:0;position:relative;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;
}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;}
#stage text{font-family:inherit;}

/* ---------- Interfaz ---------- */
.titleblock{
  position:absolute;z-index:3;
  left:clamp(12px,2.2vw,32px);top:clamp(12px,2.4vh,28px);
  display:flex;align-items:stretch;
  max-width:calc(100% - 2*clamp(12px,2.2vw,32px) - 58px);
  background:var(--panel);
  border:1.5px solid var(--line);border-left:6px solid var(--fiber);border-radius:3px;
}
.titleblock h1{margin:0;padding:12px 20px;font-size:clamp(18px,2.5vw,34px);font-weight:800;line-height:1.1;letter-spacing:-.01em;}
.titleblock .n{
  padding:12px 16px;border-left:1.5px solid var(--line);
  display:flex;align-items:center;
  font-size:clamp(13px,1.3vw,18px);font-weight:500;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.roster{
  position:absolute;z-index:3;
  left:clamp(12px,2.2vw,32px);top:calc(clamp(12px,2.4vh,28px) + clamp(52px,6vw,74px) + 10px);
  display:flex;flex-wrap:wrap;
  max-width:calc(100% - 2*clamp(12px,2.2vw,32px));
  background:var(--panel);border:1.5px solid var(--line);border-left:6px solid var(--accent);border-radius:3px;
  transition:opacity .5s ease;
}
.roster.off{opacity:0;pointer-events:none;}
.roster span{padding:9px 16px;font-size:clamp(13px,1.35vw,18px);font-weight:500;line-height:1.2;white-space:nowrap;}
.roster span + span{border-left:1.5px solid var(--line);}
.thanks{
  position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:clamp(18px,3vw,40px) clamp(36px,7vw,110px);
  background:var(--panel);border:1.5px solid var(--line);border-left:10px solid var(--fiber);border-radius:4px;
  font-size:clamp(44px,9vw,140px);font-weight:800;letter-spacing:-.02em;line-height:1;
  opacity:0;pointer-events:none;transition:opacity .8s ease .9s;
}
.thanks.on{opacity:1;}
.btn{
  all:unset;box-sizing:border-box;cursor:pointer;
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--panel);border:1.5px solid var(--line);color:var(--ink);
}
.btn[hidden]{display:none;}
.btn:hover{background:var(--panel-hover);}
.btn:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.btn svg{width:22px;height:22px;display:block;}
.btn[disabled]{opacity:.35;cursor:default;}
#fs{position:absolute;z-index:3;right:clamp(12px,2.2vw,32px);top:clamp(12px,2.4vh,28px);}
.arrows{position:absolute;z-index:3;right:clamp(12px,2.2vw,32px);bottom:clamp(14px,3vh,30px);display:flex;gap:10px;}
.dots{
  position:absolute;z-index:3;left:50%;bottom:clamp(14px,3vh,30px);transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;padding:12px 16px;
  background:var(--panel);border:1.5px solid var(--line);border-radius:999px;
}
.dots button{
  all:unset;box-sizing:border-box;cursor:pointer;
  width:10px;height:10px;border-radius:999px;background:rgba(244,241,232,.38);
  transition:width .3s ease,background .3s ease;
}
.dots button:hover{background:rgba(244,241,232,.7);}
.dots button[aria-current="true"]{width:30px;background:var(--ink);}
.hint{
  position:absolute;z-index:3;left:50%;bottom:calc(clamp(14px,3vh,30px) + 62px);transform:translateX(-50%);
  padding:8px 14px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);
  font-size:14px;color:var(--ink-soft);white-space:nowrap;
  transition:opacity .6s ease;
}
.hint.off{opacity:0;pointer-events:none;}
@media (max-width:560px){
  .dots{gap:6px;padding:10px 12px;bottom:clamp(14px,3vh,30px);left:12px;transform:none;}
  .dots button[aria-current="true"]{width:22px;}
  .hint{display:none;}
}

/* ---------- Fibra: trazo inicial ---------- */
.fiberline{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1.9s ease-out forwards;animation-delay:calc(var(--i) * .16s + .35s);}
.badge,.olt,.v51{opacity:0;animation:pop .6s ease-out forwards;animation-delay:1.6s;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes pop{to{opacity:1;}}

/* ---------- Estados por defecto de la escena detallada ---------- */
.g-car,.g-arcs,.g-glow,.g-warm{opacity:0;}
.tank-water{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.55);}
.flow{opacity:0;}
.led{opacity:.3;}
.flame{transform-box:fill-box;transform-origin:50% 100%;}
.smoke{opacity:0;transform-box:fill-box;transform-origin:center;}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;}
.tint{opacity:0;}
.led-alert{opacity:.35;}
.pulse{opacity:0;}
.live{opacity:1;}

/* ---------- Cochera ---------- */
svg[data-anim="garage"] .g-car{animation:drive 12s cubic-bezier(.25,.6,.35,1) infinite;}
svg[data-anim="garage"] .g-arcs{animation:arcs 12s linear infinite;}
svg[data-anim="garage"] .g-glow{animation:lamp 12s ease-in-out infinite;}
svg[data-anim="garage"] .g-warm{animation:lampWarm 12s ease-in-out infinite;}
svg[data-anim="garage"] .g-door{animation:door 12s ease-in-out infinite;}
svg[data-anim="garage"] .pir-led{animation:blink 1s ease-in-out infinite;}
@keyframes drive{
  0%{transform:translateX(-900px);opacity:0}
  3%{transform:translateX(-880px);opacity:1}
  34%{transform:translateX(-120px);opacity:1}
  56%{transform:translateX(-110px);opacity:1}
  66%{transform:translateX(50px);opacity:0}
  100%{transform:translateX(50px);opacity:0}
}
@keyframes arcs{0%,29%{opacity:0} 32%{opacity:1} 38%{opacity:.35} 44%{opacity:1} 50%{opacity:.35} 58%{opacity:0} 100%{opacity:0}}
@keyframes lamp{0%,34%{opacity:0} 38%,86%{opacity:1} 92%,100%{opacity:0}}
@keyframes lampWarm{0%,34%{opacity:0} 38%,86%{opacity:.22} 92%,100%{opacity:0}}
@keyframes door{0%,40%{transform:translateY(0)} 52%,78%{transform:translateY(-312px)} 90%,100%{transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ---------- Tanque ---------- */
svg[data-anim="tank"] .tank-water{animation:level 16s ease-in-out infinite;}
svg[data-anim="tank"] .flow-in{animation:flow .9s linear infinite,onFill 16s linear infinite;}
svg[data-anim="tank"] .flow-out{animation:flow .9s linear infinite,onDrain 16s linear infinite;}
svg[data-anim="tank"] .led-q1{animation:onFill 16s linear infinite;}
svg[data-anim="tank"] .led-q2{animation:onDrain 16s linear infinite;}
svg[data-anim="tank"] .s-max{animation:onMax 16s linear infinite;}
svg[data-anim="tank"] .s-min{animation:onMin 16s linear infinite;}
@keyframes level{0%{transform:scaleY(.1)}48%{transform:scaleY(.94)}58%{transform:scaleY(.94)}88%{transform:scaleY(.1)}100%{transform:scaleY(.1)}}
@keyframes onFill{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes onDrain{0%,58%{opacity:0}59%,88%{opacity:1}89%,100%{opacity:0}}
@keyframes onMax{0%,46%{opacity:.25}48%,60%{opacity:1}62%,100%{opacity:.25}}
@keyframes onMin{0%,6%{opacity:1}8%,86%{opacity:.25}88%,100%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-24px;}}

/* ---------- Interior ---------- */
svg[data-anim="interior"] .flame{animation:flick .45s ease-in-out infinite alternate;}
svg[data-anim="interior"] .smoke{animation:smoke 3.2s ease-out infinite;}
svg[data-anim="interior"] .smoke.s2{animation-delay:1.05s;}
svg[data-anim="interior"] .smoke.s3{animation-delay:2.1s;}
svg[data-anim="interior"] .ring{animation:ring 1.6s ease-out infinite;}
svg[data-anim="interior"] .ring.r2{animation-delay:.8s;}
svg[data-anim="interior"] .tint{animation:tint 1.6s ease-in-out infinite;}
svg[data-anim="interior"] .led-alert{animation:blink .6s ease-in-out infinite;}
@keyframes flick{from{transform:scale(.92,.9)}to{transform:scale(1.05,1.12)}}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.7}100%{opacity:0;transform:translateY(-62px) scale(1.5)}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
@keyframes tint{0%,100%{opacity:0}50%{opacity:.18}}

/* ---------- Enlaces de datos ---------- */
svg[data-anim="pc"] .pulse,svg[data-anim="remote"] .pulse{opacity:1;animation:dots 1.6s linear infinite;}
svg[data-anim="pc"] .live{animation:blink 1.4s ease-in-out infinite;}
@keyframes dots{to{stroke-dashoffset:-60px;}}

@media (prefers-reduced-motion: reduce){
  .fiberline{animation:none;stroke-dashoffset:0;}
  .badge,.olt,.v51{animation:none;opacity:1;}
  svg *{animation:none !important;}
  .dots button{transition:none;}
}
</style>
</head>

<script>
(function(){
'use strict';

/* ================== Utilidades ================== */
function rng(seed){var s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function shade(hex,k){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(v){return Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));}
  return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);
}
function fx(v){return v.toFixed(1);}

/* ================== Vista aérea del residencial ================== */
function buildHood(){
  var R=rng(11), s='';
  function pick(a){return a[Math.floor(R()*a.length)];}
  var roofs=['#b4795c','#a86a50','#c28b6c','#9c6650','#cf9d7b','#b98263','#a5745e','#c79473'];

  // bosque alrededor
  s+='<rect x="-600" y="-450" width="2120" height="1445" fill="#47623f"/>';
  for(var i=0;i<520;i++){
    var x=-600+R()*2120, y=-450+R()*1445;
    if(x>-6&&x<926&&y>-6&&y<551) continue;
    var r=14+R()*14;
    s+='<circle cx="'+fx(x)+'" cy="'+fx(y)+'" r="'+fx(r)+'" fill="'+pick(['#3c5835','#476a3f','#55774a','#3a5233'])+'"/>';
  }
  // suelo del plano
  s+='<rect x="0" y="0" width="920" height="545" fill="#b4ad90"/>';

  // vías
  function road(d,w){return '<path d="'+d+'" fill="none" stroke="#5d6168" stroke-width="'+w+'" stroke-linejoin="round"/>';}
  function lane(d){return '<path d="'+d+'" fill="none" stroke="#9b9fa6" stroke-width="1.2" stroke-dasharray="9 8"/>';}
  var roads=[['M24 232 L460 232 Q525 232 545 200 Q565 170 620 170 L906 170',38],['M47 232 L47 515',34],['M24 515 L906 515',30],['M488 232 L488 515',36],['M618 170 L618 515',36]];
  roads.forEach(function(r){s+=road(r[0],r[1]);});
  roads.forEach(function(r){s+=lane(r[0]);});

  // lote genérico
  function lot(x,y,w,h,yard){
    var c=pick(roofs), o='';
    o+='<rect x="'+fx(x)+'" y="'+fx(y)+'" width="'+fx(w)+'" height="'+fx(h)+'" fill="#d8d0b8" stroke="#f3efe2" stroke-width="1.3"/>';
    var rx,ry,rw,rh,yx,yy,yw,yh;
    if(yard==='t'){yh=h*.34;yx=x;yy=y;yw=w;rx=x+3;ry=y+yh;rw=w-6;rh=h-yh-3;}
    else if(yard==='b'){yh=h*.34;yx=x;yy=y+h-yh;yw=w;rx=x+3;ry=y+3;rw=w-6;rh=h-yh-3;}
    else if(yard==='l'){yw=w*.3;yx=x;yy=y;yh=h;rx=x+yw;ry=y+3;rw=w-yw-3;rh=h-6;}
    else{yw=w*.3;yx=x+w-yw;yy=y;yh=h;rx=x+3;ry=y+3;rw=w-yw-3;rh=h-6;}
    o+='<rect x="'+fx(yx+1)+'" y="'+fx(yy+1)+'" width="'+fx(yw-2)+'" height="'+fx(yh-2)+'" fill="'+(R()<.3?'#cbbf9d':'#a9bf84')+'"/>';
    if(rw>=rh){
      o+='<rect x="'+fx(rx)+'" y="'+fx(ry)+'" width="'+fx(rw)+'" height="'+fx(rh/2)+'" fill="'+c+'"/>';
      o+='<rect x="'+fx(rx)+'" y="'+fx(ry+rh/2)+'" width="'+fx(rw)+'" height="'+fx(rh/2)+'" fill="'+shade(c,-.16)+'"/>';
    }else{
      o+='<rect x="'+fx(rx)+'" y="'+fx(ry)+'" width="'+fx(rw/2)+'" height="'+fx(rh)+'" fill="'+c+'"/>';
      o+='<rect x="'+fx(rx+rw/2)+'" y="'+fx(ry)+'" width="'+fx(rw/2)+'" height="'+fx(rh)+'" fill="'+shade(c,-.16)+'"/>';
    }
    o+='<rect x="'+fx(rx)+'" y="'+fx(ry)+'" width="'+fx(rw)+'" height="'+fx(rh)+'" fill="none" stroke="'+shade(c,-.38)+'" stroke-width=".8"/>';
    if(R()<.22){o+='<circle cx="'+fx(yx+yw*(.25+R()*.5))+'" cy="'+fx(yy+yh*(.3+R()*.4))+'" r="'+fx(3.5+R()*2)+'" fill="#4f7a3f"/>';}
    return o;
  }

  // fila superior
  function topBottom(x){return x<482?[45,205]:(x<570?[62,190]:[30,148]);}
  var xs=[],i2;
  for(i2=0;i2<9;i2++)xs.push([38+i2*49.3,49.3]);
  for(i2=0;i2<2;i2++)xs.push([482+i2*44,44]);
  for(i2=0;i2<6;i2++)xs.push([570+i2*51.7,51.7]);
  xs.forEach(function(p){var tb=topBottom(p[0]);s+=lot(p[0],tb[0],p[1],tb[1]-tb[0],'t');});

  // bloque izquierdo
  s+='<rect x="64" y="250" width="406" height="250" fill="#c4bda2"/>';
  s+='<rect x="64" y="250" width="42" height="250" fill="#93ad6f"/>';
  for(i2=0;i2<8;i2++){s+=lot(108+i2*45.25,262,45.25,112,'b');}
  s+='<rect x="106" y="376" width="364" height="18" fill="#c3bd9f"/><path d="M106 385 L470 385" stroke="#ece7d6" stroke-width="3"/>';
  s+=lot(108,396,60,102,'t');
  for(i2=0;i2<6;i2++){s+=lot(200+i2*45,396,45,102,'t');}
  [[80,300],[78,358],[82,420],[80,478]].forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="#5b8447"/><circle cx="'+(p[0]-2)+'" cy="'+(p[1]-2)+'" r="5.5" fill="#6f9a58"/>';});

  // bloque derecho
  s+='<rect x="636" y="189" width="254" height="311" fill="#c4bda2"/>';
  for(i2=0;i2<7;i2++){
    s+=lot(650,194+i2*43.8,100,43.8,'l');
    s+=lot(752,194+i2*43.8,134,43.8,'r');
  }

  // isla central
  s+='<rect x="506" y="262" width="94" height="236" rx="26" fill="#86a265"/>';
  s+='<path d="M548 262 L548 498" stroke="#d9d3bd" stroke-width="5"/>';
  [[563,262,22],[567,314,22],[574,404,22],[568,462,22]].forEach(function(t){
    s+='<circle cx="'+t[0]+'" cy="'+t[1]+'" r="'+t[2]+'" fill="#3f6b3a"/><circle cx="'+(t[0]-3)+'" cy="'+(t[1]-3)+'" r="'+(t[2]-7)+'" fill="#4d8046"/><circle cx="'+(t[0]-6)+'" cy="'+(t[1]-6)+'" r="'+(t[2]-14)+'" fill="#5c9455"/>';
  });

  // árboles de borde
  function tree(x,y,r){return '<circle cx="'+fx(x)+'" cy="'+fx(y)+'" r="'+fx(r)+'" fill="#3f6338"/><circle cx="'+fx(x-r*.2)+'" cy="'+fx(y-r*.2)+'" r="'+fx(r*.65)+'" fill="#527a47"/>';}
  var x3;
  for(x3=-8;x3<930;x3+=17){s+=tree(x3+R()*6,6+R()*28,12+R()*8);}
  for(x3=-8;x3<930;x3+=19){s+=tree(x3+R()*6,536+R()*14,12+R()*7);}
  for(var y3=40;y3<530;y3+=22){s+=tree(4+R()*14,y3,9+R()*5);s+=tree(906+R()*12,y3,9+R()*5);}

  // fibra óptica
  var fiber=[
    'M548 362 L530 250 L526 198',
    'M526 198 L458 217 L228 217 L228 205',
    'M526 198 L576 166',
    'M589 163 L650 156 L846 152',
    'M548 362 L526 425 L515 447',
    'M515 447 L472 440 L472 378 L377 378',
    'M472 440 L472 505 L205 505 L205 392 L193 388',
    'M193 388 L150 442',
    'M515 447 L630 432 L630 467 L750 465',
    'M630 432 L618 287 L745 288'
  ];
  fiber.forEach(function(d,i){
    s+='<path class="fiberline" style="--i:'+i+'" pathLength="1" d="'+d+'" fill="none" stroke="#e5383b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  });

  // divisores ópticos
  var badges=[[228,205,'1:8','t'],[526,197,'1:4','t'],[589,162,'1:8','t'],[846,152,'1:8','t'],[757,288,'1:8','t'],[762,464,'1:8','t'],[515,447,'1:4','b'],[375,382,'1:8','t'],[192,388,'1:8','t']];
  badges.forEach(function(b){
    var ly=b[3]==='t'?b[1]-23:b[1]+33;
    s+='<g class="badge"><g transform="translate('+b[0]+' '+b[1]+')"><circle r="13" fill="#1b2f5e" stroke="#fff" stroke-width="1.6"/>'+
       '<path d="M-7 0H-1M-1 0L4 -6M-1 0H5M-1 0L4 6" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>'+
       '<g fill="#fff"><circle cx="-7" r="1.6"/><circle cx="5" cy="-6" r="1.6"/><circle cx="5.5" r="1.6"/><circle cx="5" cy="6" r="1.6"/></g></g>'+
       '<text x="'+b[0]+'" y="'+ly+'" font-size="14" font-weight="800" fill="#1b2f5e" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:3.4px;stroke-linejoin:round">'+b[2]+'</text></g>';
  });

  // OLT
  s+='<g class="olt"><circle cx="548" cy="362" r="21" fill="rgba(255,255,255,.6)"/><g transform="translate(548 362)"><rect x="-15" y="-10" width="30" height="20" rx="3" fill="#f2f6ff" stroke="#1b2f5e" stroke-width="2"/><rect x="-11" y="-6" width="22" height="9" fill="#7fb2ff"/><path d="M-6 6.5H6" stroke="#1b2f5e" stroke-width="1.6"/></g>'+
     '<text x="548" y="334" font-size="15" font-weight="800" fill="#1b2f5e" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:3.4px;stroke-linejoin:round">OLT</text></g>';

  // ODF
  s+='<g class="olt"><path d="M563 362 H573" stroke="#1b2f5e" stroke-width="1.6"/><rect x="573" y="353" width="27" height="18" rx="2.5" fill="#2f7be0" stroke="#1b2f5e" stroke-width="1.6"/><text x="586.5" y="365.8" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle">ODF</text></g>';

  // V51
  s+='<g class="v51"><rect x="106" y="394" width="62" height="108" rx="8" fill="none" stroke="#ffc247" stroke-width="2.4" stroke-dasharray="6 4"/>'+
     '<circle cx="137" cy="462" r="11" fill="#fff" stroke="#ffc247" stroke-width="2.4"/>'+
     '<path d="M131.5 460 A7 7 0 0 1 142.5 460 M134 463.5 A3.6 3.6 0 0 1 140 463.5" fill="none" stroke="#1b2f5e" stroke-width="1.6" stroke-linecap="round"/><circle cx="137" cy="467" r="1.4" fill="#1b2f5e"/>'+
     '<text x="137" y="414" font-size="17" font-weight="800" fill="#1b2f5e" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:3.6px;stroke-linejoin:round">V51</text></g>';

  document.getElementById('hood').innerHTML=s;
}

/* Estrellas */
function buildStars(){
  var R=rng(5),s='';
  for(var i=0;i<90;i++){
    var x=-1300+R()*6800,y=-650+R()*1050,r=1.6+R()*2.6;
    s+='<circle cx="'+fx(x)+'" cy="'+fx(y)+'" r="'+fx(r)+'" fill="#cfd9f5" opacity="'+fx(.4+R()*.5)+'"/>';
  }
  document.getElementById('stars').innerHTML=s;
}

/* ================== Cámara ================== */
var svg=document.getElementById('stage');
var hoodG=document.getElementById('hood');
var detailG=document.getElementById('detail');
var titleEl=document.getElementById('title');
var countEl=document.getElementById('count');
var dotsEl=document.getElementById('dots');
var prevBtn=document.getElementById('prev');
var nextBtn=document.getElementById('next');
var hintEl=document.getElementById('hint');
var fsBtn=document.getElementById('fs');
var rosterEl=document.getElementById('roster');
var gponG=document.getElementById('gpon');
var thanksEl=document.getElementById('thanks');
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function N(x,y,w,h){return [(x-137)*20+700,(y-455)*20+400,w*20,h*20];}

var stops=[
  {title:'Residencial El Dorado',rect:N(0,0,920,545),anim:''},
  {title:'Esquema lógico de distribución GPON',rect:N(944,176,472,327),anim:''},
  {title:'Red de fibra óptica',rect:N(95,262,480,281),anim:''},
  {title:'Vivienda automatizada',rect:[-70,110,1550,620],anim:''},
  {title:'Llenado de tanque con PLC y Factory I/O',rect:[960,215,520,505],anim:'tank'},
  {title:'Portón automático y luces de cochera',rect:[-390,330,820,395],anim:'garage'},
  {title:'Detección de incendios',rect:[395,330,580,395],anim:'interior'},
  {title:'Dashboards en ThingsBoard',rect:[1780,215,910,500],anim:'pc'},
  {title:'Monitoreo remoto',rect:[4130,330,780,395],anim:'remote'},
  {title:'Residencial El Dorado',label:'Gracias',rect:N(0,0,920,545),anim:'',thanks:true}
];

var W=window.innerWidth,H=window.innerHeight;
function measure(){var r=svg.getBoundingClientRect();W=r.width||window.innerWidth;H=r.height||window.innerHeight;}

var SAFE={top:.16,bottom:.11,side:.04};
function camFor(rect){
  var availW=W*(1-2*SAFE.side),availH=H*(1-SAFE.top-SAFE.bottom);
  var scale=Math.min(availW/rect[2],availH/rect[3]);
  var screenCy=H*(SAFE.top+(1-SAFE.top-SAFE.bottom)/2);
  return {cx:rect[0]+rect[2]/2,cy:rect[1]+rect[3]/2-(screenCy-H/2)/scale,w:W/scale};
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function render(c){
  var h=c.w*H/W;
  svg.setAttribute('viewBox',(c.cx-c.w/2)+' '+(c.cy-h/2)+' '+c.w+' '+h);
  var t=(Math.log(7500)-Math.log(c.w))/(Math.log(7500)-Math.log(3600));
  t=clamp(t,0,1);t=t*t*(3-2*t);
  detailG.style.display=t<=0.001?'none':'';
  detailG.style.opacity=t;
  hoodG.style.display=t>=0.999?'none':'';
  var cxN=(c.cx-700)/20+137,g=clamp((cxN-640)/320,0,1);
  g=g*g*(3-2*g);
  gponG.style.display=(g<=0.001||t>=0.999)?'none':'';
  gponG.style.opacity=g;
}

/* Zoom suave tipo van Wijk & Nuij */
function makeTransition(a,b){
  var rho=1.41,rho2=rho*rho,rho4=rho2*rho2;
  var dx=b.cx-a.cx,dy=b.cy-a.cy,u1=Math.hypot(dx,dy),w0=a.w,w1=b.w;
  if(u1<1e-6*Math.max(w0,w1)){
    var sign=w1>=w0?1:-1,S0=Math.abs(Math.log(w1/w0))/rho;
    return {S:S0,at:function(s){return {cx:a.cx,cy:a.cy,w:w0*Math.exp(sign*rho*s)};}};
  }
  var b0=(w1*w1-w0*w0+rho4*u1*u1)/(2*w0*rho2*u1);
  var b1=(w1*w1-w0*w0-rho4*u1*u1)/(2*w1*rho2*u1);
  var r0=Math.log(Math.sqrt(b0*b0+1)-b0),r1=Math.log(Math.sqrt(b1*b1+1)-b1);
  var S=(r1-r0)/rho;
  return {S:S,at:function(s){
    var u=(w0/rho2)*Math.cosh(r0)*Math.tanh(rho*s+r0)-(w0/rho2)*Math.sinh(r0);
    var w=w0*Math.cosh(r0)/Math.cosh(rho*s+r0);
    var k=u/u1;
    return {cx:a.cx+dx*k,cy:a.cy+dy*k,w:w};
  }};
}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

var idx=0,cam=null,raf=0,moving=false;

function updateUI(){
  titleEl.textContent=stops[idx].title;
  if(titleEl.animate&&!reduce){titleEl.animate([{opacity:0},{opacity:1}],{duration:420,easing:'ease-out'});}
  countEl.textContent=(idx+1)+' / '+stops.length;
  rosterEl.classList.toggle('off',idx!==0);
  thanksEl.classList.toggle('on',!!stops[idx].thanks);
  var btns=dotsEl.children;
  for(var i=0;i<btns.length;i++){
    if(i===idx)btns[i].setAttribute('aria-current','true');else btns[i].removeAttribute('aria-current');
  }
  prevBtn.disabled=idx===0;nextBtn.disabled=idx===stops.length-1;
}
function arrive(i){svg.setAttribute('data-anim',stops[i].anim||'');moving=false;}

function go(i){
  i=clamp(i,0,stops.length-1);
  if(i===idx&&!moving)return;
  hintEl.classList.add('off');
  var target=camFor(stops[i].rect);
  idx=i;updateUI();
  cancelAnimationFrame(raf);
  if(reduce){cam=target;render(cam);arrive(i);return;}
  var tr=makeTransition(cam,target);
  if(!isFinite(tr.S)||tr.S<.001){cam=target;render(cam);arrive(i);return;}
  var dur=clamp(tr.S*1250,1100,4200),t0=performance.now();
  moving=true;
  function step(now){
    var t=Math.min(1,(now-t0)/dur);
    cam=t>=1?target:tr.at(tr.S*ease(t));
    render(cam);
    if(t<1)raf=requestAnimationFrame(step);else arrive(i);
  }
  raf=requestAnimationFrame(step);
}

/* ================== Entradas ================== */
stops.forEach(function(s,i){
  var b=document.createElement('button');
  b.type='button';b.setAttribute('aria-label',s.label||s.title);
  b.addEventListener('click',function(){go(i);});
  dotsEl.appendChild(b);
});
prevBtn.addEventListener('click',function(){go(idx-1);});
nextBtn.addEventListener('click',function(){go(idx+1);});

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '){e.preventDefault();go(idx+1);}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();go(idx-1);}
  else if(k==='Home'){go(0);}
  else if(k==='End'){go(stops.length-1);}
  else if(k==='f'||k==='F'){toggleFs();}
});

var acc=0,wheelLock=false;
window.addEventListener('wheel',function(e){
  e.preventDefault();
  if(wheelLock)return;
  acc+=e.deltaY;
  if(Math.abs(acc)>50){go(idx+(acc>0?1:-1));acc=0;wheelLock=true;setTimeout(function(){wheelLock=false;},900);}
},{passive:false});

var tx=0,ty=0;
window.addEventListener('touchstart',function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
window.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<50)return;
  var d=Math.abs(dx)>Math.abs(dy)?dx:dy;
  go(idx+(d<0?1:-1));
},{passive:true});

function toggleFs(){
  try{
    if(document.fullscreenElement){document.exitFullscreen();}
    else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}
  }catch(err){}
}
if(document.fullscreenEnabled){fsBtn.hidden=false;fsBtn.addEventListener('click',toggleFs);}

window.addEventListener('resize',function(){
  measure();
  if(!moving){cam=camFor(stops[idx].rect);render(cam);}
  else{/* la transición en curso toma el nuevo tamaño en el siguiente cuadro */}
});

/* ================== Inicio ================== */
buildHood();
buildStars();
measure();
cam=camFor(stops[0].rect);
render(cam);
updateUI();
setTimeout(function(){hintEl.classList.add('off');},7000);
})();
</script>
